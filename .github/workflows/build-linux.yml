name: Build for Linux

# Builds against an explicitly pinned Rack SDK, like the macOS workflow,
# instead of the qno/rack-plugin-toolchain Docker image. That image bundles
# its own (older) SDK, and the version skew is what kept this workflow red:
# code using Rack 2.6 API (e.g. HoverKeyEvent::isKeyCommand) built fine on
# macOS and in the library's own toolchain but failed here.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  rack-sdk-version: 2.6.4

jobs:
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and setup VCV Rack SDK
        run: |
          cd $HOME
          wget -q https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-lin-x64.zip
          unzip -q Rack-SDK-${{ env.rack-sdk-version }}-lin-x64.zip
          echo "RACK_DIR=$HOME/Rack-SDK" >> $GITHUB_ENV

      - name: Build plugin
        run: |
          make -j$(nproc) RACK_DIR=$RACK_DIR
          ls -lh plugin.so

      - name: Create distribution package
        run: |
          make dist RACK_DIR=$RACK_DIR
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxglitch-linux-x64-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/*.vcvplugin
          retention-days: 30

      - name: Upload release assets (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.vcvplugin
          token: ${{ secrets.GITHUB_TOKEN }}
