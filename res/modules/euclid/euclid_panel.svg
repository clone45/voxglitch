<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Voxglitch "EUCLID" panel. Generated by scripts/generate_euclid_panel.py; do not hand-edit, regenerate.
  9 HP = 45.72 mm = 135 px (RACK_GRID_WIDTH 15 x 9). Height 128.5 mm to match the other Voxglitch panels.
  viewBox is 1:1 with Rack pixels, so every coordinate here IS a Rack coordinate.
  Dark variant: python3 scripts/generate_dark_panel.py res/modules/euclid/euclid_panel.svg (the generator script runs it
  and re-inserts the *_display plate, which the dark pass strips).
  Ids ending _input/_output/_knob/_button/_switch/_light are the contract with src/modules/Euclid/EuclidWidget.hpp
  (PanelHelper::findNamed); outputs_plate, ring_display are read with findNamedRect.
  House style: flat background; rounded plates (rx 4.5) behind output clusters only; labels are Pilat Bold 7 pt
  outlines (no text elements); jack markers r 11.764; knob/switch/button/light anchor dots r 2.5 (timeline idiom).
  Every colour is a key of the generate_dark_panel.py COLOR_MAP (plus the dot and dark-plate pass-throughs).
  Screw squares x 15..30 and 105..120, y 0..15 and 365..380 are kept clear of anchors.
  Wordmark at its house position (ink x 20.7..59.0); the EUCLID frame beside it at (74.8, 12.85).
  ring_display (9,30) 117 x 117 dark plate, rx 3, centred; the ring widget paints it (findNamedRect) and it
  stays dark in both themes (re-inserted after the dark pass).
  Three columns at cx 22.5 67.5 112.5 (HITS STEPS ROT): labels at 170 ABOVE the knobs, knobs cy 192
  (RoundBlackKnob), attenuverters cy 232 (Trimpot), CV jacks cy 268; all three unlabelled below the knob label,
  tied together by a 1.2 px column rule from the knob centre to the jack centre (drawn under the components).
  Bottom row cy 328, labels at 306.7: CLK RST (inputs, no plate) and TRIG on the (94,295) 37 x 57 plate.
  Row gaps (ink to ink): 7.76 17.9 7.85 16.9 15.3 21.84 px; the plate ends 13 px above the bottom screws.
-->
