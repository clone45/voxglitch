<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="40.64mm" height="128.6mm"
     viewBox="0 0 115.2 364.252"
     sodipodi:docname="looper_panel.svg"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape">
  <defs>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="364.252" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:#ececec;stop-opacity:1" />
      <stop offset="1" style="stop-color:#d9d9d9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Panel background -->
  <rect x="0" y="0" width="115.2" height="364.252" style="fill:url(#panelGradient);stroke:none" />

  <!-- Waveform frame: full-height narrow vertical strip on the right side.
       Margin of 8 units on top, bottom, and right (matching all three). -->
  <rect id="waveform_backing" x="75.2" y="8" width="32" height="348.252"
        style="fill:#1a2225;stroke:#0c1117;stroke-width:1;rx:3;ry:3" />

  <!-- ================================================================== -->
  <!-- Left column (cx=18) -- existing controls and outputs                -->
  <!-- ================================================================== -->

  <!-- Input + knobs (40 unit spacing, room for label above each) -->
  <circle id="reset_input"        cx="18" cy="35"  r="11.338583" style="fill:#213d42;stroke:none" />
  <circle id="bpm_knob"           cx="18" cy="75"  r="10" style="fill:#2c2c2c;stroke:none" />
  <circle id="nudge_knob"         cx="18" cy="115" r="10" style="fill:#2c2c2c;stroke:none" />
  <circle id="volume_knob"        cx="18" cy="155" r="10" style="fill:#2c2c2c;stroke:none" />

  <!-- Trigger outputs (35 unit spacing -- tight but labels clear) -->
  <circle id="bar_output"         cx="18" cy="205" r="11.338583" style="fill:#213d42;stroke:none" />
  <circle id="beat_output"        cx="18" cy="240" r="11.338583" style="fill:#213d42;stroke:none" />
  <circle id="subdiv_output"      cx="18" cy="275" r="11.338583" style="fill:#213d42;stroke:none" />

  <!-- Audio outputs (35 unit spacing) -->
  <circle id="left_output"        cx="18" cy="310" r="11.338583" style="fill:#213d42;stroke:none" />
  <circle id="right_output"       cx="18" cy="345" r="11.338583" style="fill:#213d42;stroke:none" />

  <!-- ================================================================== -->
  <!-- Second column (cx=52) -- transport controls + future expansion     -->
  <!--                                                                    -->
  <!-- Placeholders for the upcoming Start/Stop transport pair. They      -->
  <!-- have id attributes so panelHelper.findNamed() will resolve them    -->
  <!-- once the corresponding params/inputs are added in Looper.hpp and   -->
  <!-- wired up in LooperWidget.hpp. Until then they just render as       -->
  <!-- placeholder circles -- harmless.                                   -->
  <!-- ================================================================== -->

  <!-- Transport input (gate; toggles play/stop on rising edge) -->
  <circle id="start_stop_input"   cx="52" cy="35"  r="11.338583" style="fill:#213d42;stroke:none" />

  <!-- Manual transport button -->
  <circle id="start_stop_button"  cx="52" cy="70"  r="6"         style="fill:#2c2c2c;stroke:none" />

</svg>
