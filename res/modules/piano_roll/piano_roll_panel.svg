<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Voxglitch "Piano Roll" panel — PLACEHOLDER, following the house construction.

  House style (from hazumi / cue_research / note_detector):
    background      flat #e7e7e7 (Inkscape solid swatch "LIght Panel Background")
    control groups  #d2d2d3 rounded rects, rx 4.5 (outputs only)
    artwork+labels  #0c1218 PATHS (never <text> — NanoSVG does not render text)
    jack markers    #213d42 circles, ids ending _input / _output
    branding        VOXGLITCH wordmark + boxed module name, top left
  The dark variant is generated by scripts/generate_dark_panel.py, which maps
  those colours and strips the jack markers.

  52 HP = 264.16 mm = 780 px exactly (RACK_GRID_WIDTH 15 x 52). Height is 128.5mm
  to match the other 65 Voxglitch panels. The viewBox is authored 1:1 with Rack
  pixels in both axes, so coordinates here ARE Rack coordinates and match the
  constants in PianoRollWidget.hpp exactly.

  Geometry per docs/modules/piano-roll/rack-port-design.md section 7:
    control bar  x  54, y   8, 609 x  40   (Snap - Track x8 - REC)
    editor       x  54, y  53, 609 x 322   (ruler 16 + grid 306 = 34 rows x 9 px)
    inputs       cx 26                     (left of the editor)
    outputs      cx 694 / 734              (right of the editor)
-->

